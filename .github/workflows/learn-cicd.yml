# ─────────────────────────────────────────────────────────────
# learn-cicd.yml — a starter pipeline for learning CI/CD basics
#
# A workflow is a YAML file in .github/workflows/. GitHub Actions
# reads it, spins up a fresh virtual machine ("runner"), and runs
# the steps below every time a trigger fires.
# ─────────────────────────────────────────────────────────────

name: Learn CI/CD

# WHEN does this pipeline run? (the "trigger")
on:
  push:
    branches: [claude/learn-cicd-basics-4M6xY]
  pull_request:
  workflow_dispatch:        # adds a "Run workflow" button in the UI

# A workflow contains one or more JOBS. Jobs run in parallel by
# default; use `needs:` to chain them (see `deploy` below).
jobs:

  # ── Stage 1: BUILD ────────────────────────────────────────
  # In a real project this is where you'd compile code or install
  # dependencies. Here we just check out the repo and look around.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Show repo contents
        run: ls -la

      - name: Print a friendly hello
        run: echo "Build stage complete on commit ${GITHUB_SHA::7}"

  # ── Stage 2: TEST ─────────────────────────────────────────
  # Real pipelines run unit tests, linters, type checks, etc.
  # We run two trivial checks so you can see green checkmarks.
  test:
    runs-on: ubuntu-latest
    needs: build           # wait for `build` to succeed first
    steps:
      - uses: actions/checkout@v4

      - name: Verify README exists
        run: test -f README.md && echo "README.md found"

      - name: Count markdown files (just for fun)
        run: |
          count=$(find . -name "*.md" -not -path "./.git/*" | wc -l)
          echo "This repo has $count markdown files."

  # ── Stage 3: DEPLOY (simulated) ───────────────────────────
  # A real deploy might push a Docker image or call a cloud API.
  # We just print a message — and only on the main branch, which
  # is how you gate production deploys.
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Pretend to deploy
        run: echo "🚀 Would deploy commit ${GITHUB_SHA::7} to production here."
